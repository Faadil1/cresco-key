[package]
name = "keys"
version = "0.3.0"
description = "CRESCO Key — exact mobile payment authority on Solana."
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "keys"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["associated_token", "token", "token_2022"] }
blake3 = { version = "=1.8.2", default-features = false }
