name: MWA Session Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/mwa-session-evidence.sh"
      - ".github/workflows/mwa-session-evidence.yml"

permissions:
  contents: read

jobs:
  mwa-session:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout CRESCO Key
        uses: actions/checkout@v4
      - name: Checkout official Mock MWA Wallet
        uses: actions/checkout@v4
        with:
          repository: solana-mobile/mock-mwa-wallet
          path: vendor/mock-mwa-wallet
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run MWA session evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          script: bash scripts/mwa-session-evidence.sh
      - name: Upload MWA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-mwa-session-evidence
          path: evidence/mwa-session/
          if-no-files-found: warn
          retention-days: 30
