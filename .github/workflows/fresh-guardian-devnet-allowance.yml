name: Fresh Guardian Devnet Allow Once (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_fresh_guardian_allowance:
        description: "Authorize a new 12-demo-token Guardian-signed Devnet allowance, its mutation/redeem/replay checks, and modest Devnet SOL fees"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cresco-key-fresh-guardian-devnet-allowance
  cancel-in-progress: false

jobs:
  fresh-proof:
    if: ${{ inputs.confirm_fresh_guardian_allowance == true }}
    runs-on: ubuntu-latest
    environment: devnet-deploy
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/devnet
    env:
      CRESCO_RENEW_DEVNET_OPT_IN: I_AUTHORIZE_FRESH_GUARDIAN_DEVNET_ALLOWANCE
      CRESCO_GUARDIAN_KEYPAIR_JSON: ${{ secrets.CRESCO_GUARDIAN_KEYPAIR_JSON }}
      CRESCO_BENEFICIARY_KEYPAIR_JSON: ${{ secrets.CRESCO_BENEFICIARY_KEYPAIR_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install Devnet dependencies
        run: npm install --ignore-scripts
      - name: Confirm runner syntax and fixture
        run: |
          node --check renew-fresh-exact-allowance.cjs
          test -s ../../evidence/devnet-distinct-program/cresco-key-demo-state-37182728261.json
      - name: Guarded fresh Guardian grant and real Devnet outcomes
        run: node renew-fresh-exact-allowance.cjs
      - name: Preserve partial or complete public receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-fresh-guardian-onchain-allowance-evidence
          path: evidence/devnet-distinct-program/fresh-exact-allowance-receipt.json
          if-no-files-found: warn
          retention-days: 30
