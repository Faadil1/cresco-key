name: Mobile G1 Configured Preflight

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "evidence/devnet-distinct-program/cresco-key-demo-state-37182728261.json"
      - "tools/devnet/write-mobile-env-from-demo-state.cjs"
      - ".github/workflows/mobile-g1-configured-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Generate mobile environment from public Devnet receipt
        working-directory: .
        run: |
          node tools/devnet/write-mobile-env-from-demo-state.cjs \
            evidence/devnet-distinct-program/cresco-key-demo-state-37182728261.json \
            apps/mobile/.env

      - name: Install dependencies
        run: npm install

      - name: Typecheck configured mobile client
        run: npm run typecheck

      - name: Expo prebuild Android with configured G1 state
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Write configured preflight receipt
        working-directory: .
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p evidence/mobile-g1
          node - <<'NODE' > evidence/mobile-g1/configured-preflight-receipt.json
          const fs = require("node:fs");
          const state = JSON.parse(fs.readFileSync(
            "evidence/devnet-distinct-program/cresco-key-demo-state-37182728261.json",
            "utf8",
          ));
          console.log(JSON.stringify({
            schema: "cresco-key/mobile-g1-configured-preflight/v1",
            commit: process.env.COMMIT_SHA,
            evidenceClass: "BUILD_CONFIGURATION",
            sourceDevnetRun: state.source.githubActionsRun,
            programId: state.programId,
            mandate: state.mandate,
            mandateNonce: state.mandateNonce,
            mint: state.mint,
            solanaPayIntentsPresent: {
              inBounds5: Boolean(state.solanaPay?.inBounds5),
              boundary12: Boolean(state.solanaPay?.boundary12),
              changedRecipient12: Boolean(state.solanaPay?.changedRecipient12)
            },
            truthBoundary: {
              configuredAgainstDistinctDevnetProgram: true,
              mobileCrescoTransactionProven: false,
              fullLiveCoreLoopProven: false,
              physicalAndroidProven: false,
              productionWalletCompatibilityProven: false
            },
            generatedAt: new Date().toISOString()
          }, null, 2));
          NODE

      - name: Upload configured preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-mobile-g1-configured-preflight
          path: evidence/mobile-g1/configured-preflight-receipt.json
          if-no-files-found: error
          retention-days: 14
