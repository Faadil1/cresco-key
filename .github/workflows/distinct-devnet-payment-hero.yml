name: Distinct Cresco Key Live Devnet Payment Hero

on:
  workflow_dispatch:
    inputs:
      confirm_devnet_test:
        description: "I authorize 5+12 demo SPL-token transactions and expected failed transactions using repository-controlled Devnet-only signer secrets"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cresco-key-distinct-devnet-hero
  cancel-in-progress: false

jobs:
  run-real-hero:
    if: ${{ inputs.confirm_devnet_test == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: devnet-deploy
    defaults:
      run:
        working-directory: tools/devnet
    env:
      CRESCO_EXPLICIT_DEVNET_HERO_OPT_IN: I_ACCEPT_DEVNET_DEMO_TOKEN_TRANSACTIONS
      CRESCO_GUARDIAN_KEYPAIR_JSON: ${{ secrets.CRESCO_GUARDIAN_KEYPAIR_JSON }}
      CRESCO_BENEFICIARY_KEYPAIR_JSON: ${{ secrets.CRESCO_BENEFICIARY_KEYPAIR_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install Devnet-only dependencies
        run: npm install --ignore-scripts

      - name: Check proof source and public signer addresses
        run: |
          node --check prove-distinct-payment-hero.cjs
          test -s ../../evidence/devnet-distinct-program/cresco-key-demo-state-37182728261.json
          test -n "$CRESCO_GUARDIAN_KEYPAIR_JSON"
          test -n "$CRESCO_BENEFICIARY_KEYPAIR_JSON"

      - name: Execute source-matched live Devnet financial sequence
        run: node prove-distinct-payment-hero.cjs

      - name: Upload public Devnet transaction evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-distinct-program-devnet-payment-hero
          path: evidence/devnet-distinct-program/payment-hero-live-receipt.json
          if-no-files-found: warn
          retention-days: 60
