name: Devnet MWA Transaction Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "scripts/devnet-mwa-transaction-evidence.sh"
      - ".github/workflows/devnet-mwa-transaction-evidence.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/devnet-mwa-transaction-evidence.sh"
      - ".github/workflows/devnet-mwa-transaction-evidence.yml"

permissions:
  contents: read

jobs:
  devnet-mwa-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout CRESCO Key
        uses: actions/checkout@v4
      - name: Checkout official Mock MWA Wallet
        uses: actions/checkout@v4
        with:
          repository: solana-mobile/mock-mwa-wallet
          path: vendor/mock-mwa-wallet
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Devnet MWA transaction evidence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          EXPO_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          script: bash scripts/devnet-mwa-transaction-evidence.sh
      - name: Upload Devnet MWA transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-devnet-mwa-transaction-evidence
          path: evidence/devnet-mwa-transaction/
          if-no-files-found: warn
          retention-days: 30
