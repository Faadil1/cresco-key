name: Rust Program CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/rust-program-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/rust-program-ci.yml"

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test CRESCO Key program
        run: cargo test -p keys
