name: Devnet Tooling CI

on:
  pull_request:
    paths:
      - "tools/devnet/**"
      - "scripts/devnet-program-deploy-evidence.sh"
      - "scripts/devnet-payment-bootstrap-evidence.sh"
      - ".github/workflows/devnet-tooling-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/devnet/**"
      - "scripts/devnet-program-deploy-evidence.sh"
      - "scripts/devnet-payment-bootstrap-evidence.sh"
      - ".github/workflows/devnet-tooling-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/devnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: npm install
      - run: npm run check
      - name: Check Devnet gate shell harnesses
        working-directory: .
        run: bash -n scripts/devnet-program-deploy-evidence.sh scripts/devnet-payment-bootstrap-evidence.sh
