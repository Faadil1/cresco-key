name: Deploy Boundary Relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/relay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install
        run: npm ci

      - name: Test relay
        run: npm test

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/relay
          command: deploy

      - name: Require deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Wrangler action did not return a deployment URL."
            exit 1
          fi
          echo "Boundary relay: $DEPLOYMENT_URL"

      - name: Verify real public health and Durable Object readiness
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/smoke-public-readiness.mjs

      - name: Write deployment receipt
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ../../evidence/relay
          node - <<'NODE' > ../../evidence/relay/deployment-receipt.json
          const base = process.env.DEPLOYMENT_URL.replace(/\/$/, "");
          console.log(JSON.stringify({
            schema: "cresco-key/relay-deployment-receipt/v1",
            commit: process.env.COMMIT_SHA,
            deploymentUrl: base,
            healthUrl: base + "/health",
            readyUrl: base + "/ready",
            durableObjectReadyVerified: true,
            publicRouteHealthVerified: true,
            authority: "coordination-only",
            generatedAt: new Date().toISOString()
          }, null, 2));
          NODE

      - name: Upload relay deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: cresco-key-relay-deployment-receipt
          path: evidence/relay/deployment-receipt.json
          if-no-files-found: error
          retention-days: 30
