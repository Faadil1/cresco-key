        The open generic Memo-based MWA transaction proof is useful technical evidence but is not the load-bearing product loop.
        Under Product Reality v1.3 it remains secondary and must not displace distinct-program deployment and the real CRESCO action path.
    - id: MISSING_LIFECYCLE_MANIFEST
      status: REPAIRED_AT_THIS_RECONCILIATION
      detail: >-
        The project predates System Control Plane v1 and did not contain the required lifecycle coverage manifest.
        The new manifest is created now without claiming it existed earlier.
    - id: MISSING_EVIDENCE_GRAPH
      status: REPAIRED_AT_THIS_RECONCILIATION
      detail: >-
        Material runtime and transaction claims existed before Claim-Runtime-Evidence Graph v1.
        A project graph is created now and existing evidence is reused only at its true class.
    - id: ENGINEERING_QUALITY_RECEIPT_MISSING
      status: RESOLVED_WITH_ACCEPTED_DEBT
      detail: >-
        Bounded Engineering Quality backfill completed on 2026-10-02 with verdict PASS_WITH_ACCEPTED_DEBT.
