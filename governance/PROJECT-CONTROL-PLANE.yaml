      Human retains wallet/program-key custody, external secrets, final submission and irreversible production actions.
    next_product_gate_after_system_repair: LIVE_CORE_G0_DISTINCT_CRESCO_KEY_DEVNET_PROGRAM_DEPLOY_AND_BOOTSTRAP

