[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

# IMPORTANT: this branch intentionally has no Devnet program mapping yet.
# The copied baseline declare_id is compile-only until a distinct CRESCO Key
# program keypair/id is provisioned. Do not deploy over the original CRESCO
# Devnet proof program.
[programs.localnet]
keys = "ABjE6V5q9VbD3CAHDXxvztY5kXQmDXHRcEP1kZ4KSSfk"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test -p keys"
